<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인공지능일반 포트폴리오</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .dark .glass-card {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 transition-colors duration-300 min-h-screen flex flex-col">

    <!-- Header Navigation -->
    <header class="sticky top-0 z-40 w-full backdrop-blur flex-none transition-colors duration-500 lg:z-50 lg:border-b lg:border-slate-900/10 dark:border-slate-50/10 bg-white/75 dark:bg-slate-900/75">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-3">
                    <div class="p-2 bg-indigo-600 rounded-xl text-white shadow-lg shadow-indigo-500/30">
                        <i data-lucide="cpu" class="w-6 h-6"></i>
                    </div>
                    <span class="font-bold text-xl tracking-tight bg-gradient-to-r from-indigo-600 to-violet-600 bg-clip-text text-transparent dark:from-indigo-400 dark:to-violet-400">
                        AI Portfolio
                    </span>
                </div>
                <div class="flex items-center gap-4">
                    <button id="themeToggle" class="p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition">
                        <i data-lucide="moon" class="w-5 h-5 dark:hidden"></i>
                        <i data-lucide="sun" class="w-5 h-5 hidden dark:block"></i>
                    </button>
                </div>

        </div>
    </header>

    <!-- Hero Section -->

        <div class="absolute inset-0 bg-gradient-to-br from-indigo-50 via-slate-50 to-purple-50 dark:from-slate-950 dark:via-slate-900 dark:to-indigo-950 -z-10"></div>
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
            <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-indigo-100 dark:bg-indigo-900/50 text-indigo-700 dark:text-indigo-300 mb-6">
                <i data-lucide="sparkles" class="w-3.5 h-3.5"></i> 2026학년도 1학기 성과물
            </span>
            <h1 class="text-4xl sm:text-5xl md:text-6xl font-extrabold tracking-tight mb-6">

            </h1>
            <p class="max-w-2xl mx-auto text-lg text-slate-600 dark:text-slate-300 mb-10 leading-relaxed">

                인공지능 기술을 활용하여 성장한 학습 탐구 여정을 기록합니다.
            </p>
            <div class="flex flex-wrap justify-center gap-4 text-sm font-medium text-slate-500 dark:text-slate-400">
                <div class="flex items-center gap-1.5 bg-white dark:bg-slate-800 px-4 py-2 rounded-full shadow-sm">
                    <i data-lucide="user" class="w-4 h-4 text-indigo-500"></i> 작성자: 홍길동
                </div>
                <div class="flex items-center gap-1.5 bg-white dark:bg-slate-800 px-4 py-2 rounded-full shadow-sm">
                    <i data-lucide="book-open" class="w-4 h-4 text-indigo-500"></i> 지도교사: 김AI 선생님
                </div>
                <div class="flex items-center gap-1.5 bg-white dark:bg-slate-800 px-4 py-2 rounded-full shadow-sm">
                    <i data-lucide="layers" class="w-4 h-4 text-indigo-500"></i> 총 8개 프로젝트
                </div>
            </div>
        </div>
    </section>

    <!-- Main Content Grid -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 flex-1">
        <div id="cardGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Cards will be injected dynamically via JS -->
        </div>
    </main>

    <!-- Modal Popup for Card Details (Only for cards without direct link) -->
    <div id="modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="bg-white dark:bg-slate-800 rounded-3xl max-w-2xl w-full max-h-[90vh] overflow-y-auto shadow-2xl transform scale-95 transition-transform duration-300 border border-slate-100 dark:border-slate-700" id="modalContainer">
            <div class="p-6 sm:p-8">
                <div class="flex justify-between items-start mb-6">
                    <div class="flex items-center gap-3">
                        <div id="modalIcon" class="p-3 rounded-2xl bg-indigo-50 dark:bg-indigo-900/30 text-indigo-600 dark:text-indigo-400"></div>
                        <div>
                            <span id="modalCategory" class="text-xs font-bold text-indigo-600 dark:text-indigo-400 uppercase tracking-wider"></span>
                            <h3 id="modalTitle" class="text-2xl font-bold text-slate-900 dark:text-white mt-0.5"></h3>
                        </div>
                    </div>
                    <button id="closeModal" class="p-2 rounded-full text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700 transition">
                        <i data-lucide="x" class="w-6 h-6"></i>
                    </button>
                </div>
                
                <div id="modalBody" class="space-y-4 text-slate-600 dark:text-slate-300 leading-relaxed">
                    <!-- Dynamic modal content -->
                </div>

                <div class="mt-8 pt-6 border-t border-slate-100 dark:border-slate-700/60 flex justify-end">
                    <button id="modalCloseBtn" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-medium transition shadow-lg shadow-indigo-500/20">
                        확인
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-white dark:bg-slate-950 border-t border-slate-200 dark:border-slate-800 py-8 mt-auto">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-sm text-slate-500 dark:text-slate-400">
            <p>© 2026 인공지능일반 포트폴리오. All rights reserved.</p>
            <p class="mt-1">본 포트폴리오는 생성형 AI 활용 가이드라인을 준수하여 작성되었습니다.</p>
        </div>
    </footer>

                details: `
                    <h4 class="font-bold text-lg text-slate-900 dark:text-white mb-2">우리 동네 스마트 쓰레기통 최적 입지 선정</h4>

                    <div class="bg-rose-50 dark:bg-rose-900/20 p-4 rounded-xl text-sm border border-rose-100 dark:border-rose-800">
                        <p class="font-semibold text-rose-800 dark:text-rose-300 mb-1">🔍 인사이트 도출:</p>
                        <p>버스 정류장 부근과 유동인구가 집중되는 상가 입구 주변의 민원 발생율이 68% 이상을 차지함을 확인. 이에 기초한 스마트 클린존 설치 가이드 제시.</p>

                icon: "layout-grid",

                details: `
                    <h4 class="font-bold text-lg text-slate-900 dark:text-white mb-2">웹앱 이름: "클린Meal - 급식 잔반 줄이기"</h4>
                    <p class="mb-3">학생들의 잔반을 줄이고 당일 메뉴에 대한 직관적 평가를 수집하는 AI 기반 분석 웹 프로토타입입니다.</p>
                    <div class="space-y-2">
                        <div class="p-3 bg-slate-100 dark:bg-slate-700/50 rounded-lg text-xs font-mono">
                            // 주요 기능: 이미지 인식 기반 잔반 측정 알고리즘 모델 접목<br>
                            function analyzeFoodWaste(imageInput) { ... }
                        </div>
                        <p class="text-sm">기대 효과: 잔반량 20% 감소, 잔반 처리 비용 절감 효과 실현</p>
                    </div>
                `
            },
            {
                id: "public-data-app",
                title: "공공데이터 앱",
                category: "데이터 응용",
                icon: "database",
                color: "from-indigo-500 to-violet-600",
                badge: "API 연동",
                shortDesc: "국가 공공데이터포털 Open API를 연동하여 실시간 미세먼지 측정 및 알림 앱을 제작했습니다.",
                details: `
                    <h4 class="font-bold text-lg text-slate-900 dark:text-white mb-2">에어체크 (AirCheck) - 실시간 대기질 안내 앱</h4>
                    <p class="mb-3">공공데이터포털의 한국환경공단 에어코리아 대기오염정보 Open API를 활용한 실용 앱입니다.</p>
                    <ul class="list-disc list-inside text-sm space-y-1">
                        <li>GPS 위치 기반 현재 동네 미세먼지/초미세먼지 농도 수집</li>
                        <li>취약계층을 위한 마스크 착용 권고 자동 알림 기능 제공</li>
                        <li>JSON 형식 데이터 파싱 및 파이썬 Streamlit 인터페이스 구성</li>

            },
            {
                id: "final-reflection",
                title: "최종 성찰 내용",
                category: "성장 소감",

                color: "from-teal-500 to-emerald-600",
                badge: "메타인지",
                shortDesc: "한 학기 동안 인공지능일반 수업을 이수하며 느낀 자신의 기술적, 윤리적 성장에 대한 총평입니다.",
                details: `
                    <h4 class="font-bold text-lg text-slate-900 dark:text-white mb-2">한 학기 AI 배움의 여정을 마치며</h4>
                    <p class="mb-3">인공지능을 단순한 '신기한 도구'로 바라보던 시선에서, '사회적 문제를 해결하는 강력한 무기'이자 '책임감을 갖고 다뤄야 할 기술'로 시야가 넓어졌습니다.</p>
                    <blockquote class="p-4 italic border-l-4 border-teal-500 bg-teal-50 dark:bg-teal-900/20 text-slate-700 dark:text-slate-200 rounded-r-xl text-sm">
                        "기술의 단순 활용을 넘어, 공공을 향한 문제의식과 데이터 기반 해결책을 도출할 수 있었던 뜻깊은 탐구 활동이었습니다."
                    </blockquote>
                `
            }
        ];

        // Card Click Handler
        function handleCardClick(id) {
            const item = portfolioItems.find(p => p.id === id);
            if (item && item.link) {
                window.location.href = item.link;
            } else {
                openModal(id);
            }
        }

        // Render Portfolio Cards
        function renderCards() {
            const grid = document.getElementById('cardGrid');
            grid.innerHTML = portfolioItems.map((item) => `
                <div onclick="handleCardClick('${item.id}')" 
                     class="group cursor-pointer glass-card rounded-3xl p-6 shadow-sm hover:shadow-xl hover:-translate-y-1.5 transition-all duration-300 flex flex-col justify-between relative overflow-hidden">
                    <div class="absolute -right-10 -top-10 w-32 h-32 bg-gradient-to-br ${item.color} opacity-10 group-hover:opacity-20 rounded-full transition-opacity blur-xl"></div>
                    
                    <div>
                        <div class="flex items-center justify-between mb-4">
                            <div class="p-3 rounded-2xl bg-gradient-to-br ${item.color} text-white shadow-md">
                                <i data-lucide="${item.icon}" class="w-6 h-6"></i>
                            </div>
                            <span class="text-xs font-semibold px-3 py-1 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300">
                                ${item.badge}
                            </span>
                        </div>
                        <span class="text-xs font-bold text-indigo-600 dark:text-indigo-400 tracking-wider uppercase">${item.category}</span>
                        <h3 class="text-xl font-bold text-slate-900 dark:text-white mt-1 mb-2 group-hover:text-indigo-600 dark:group-hover:text-indigo-400 transition-colors">
                            ${item.title}
                        </h3>
                        <p class="text-sm text-slate-600 dark:text-slate-300 leading-relaxed line-clamp-3">
                            ${item.shortDesc}
                        </p>
                    </div>

                    <div class="mt-6 pt-4 border-t border-slate-100 dark:border-slate-800 flex items-center justify-between text-xs font-medium text-slate-500 dark:text-slate-400">
                        <span>자세히 보기</span>
                        <i data-lucide="arrow-right" class="w-4 h-4 group-hover:translate-x-1 transition-transform text-indigo-500"></i>
                    </div>
                </div>
            `).join('');

            lucide.createIcons();
        }

        // Modal Control
        const modal = document.getElementById('modal');
        const modalContainer = document.getElementById('modalContainer');

        function openModal(id) {
            const item = portfolioItems.find(p => p.id === id);
            if (!item || !item.details) return;

            document.getElementById('modalCategory').innerText = item.category;
            document.getElementById('modalTitle').innerText = item.title;
            document.getElementById('modalIcon').innerHTML = `<i data-lucide="${item.icon}" class="w-6 h-6"></i>`;
            document.getElementById('modalBody').innerHTML = item.details;

            lucide.createIcons();

            modal.classList.remove('opacity-0', 'pointer-events-none');
            modalContainer.classList.remove('scale-95');
            modalContainer.classList.add('scale-100');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modal.classList.add('opacity-0', 'pointer-events-none');
            modalContainer.classList.remove('scale-100');
            modalContainer.classList.add('scale-95');
            document.body.style.overflow = 'auto';
        }

        document.getElementById('closeModal').addEventListener('click', closeModal);
        document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });

        // Dark Mode Toggle
        const themeToggleBtn = document.getElementById('themeToggle');
        themeToggleBtn.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
        });

        // Initialize App
        window.addEventListener('DOMContentLoaded', () => {
            renderCards();
        });
    </script>
</body>
</html>
